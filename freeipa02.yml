---
- name: Set up FreeIPA
  hosts: freeipa02
  become: true

  roles:
    - role: rsyslog
      tags: logs

    - role: auditd
      tags: audit

    - role: sshd

    - role: sudo

    - role: freeipa
      tags: freeipa,auth

    - role: prometheus_client
      tags: metrics

    - role: freeipa_client
      tags: auth

    - role: ca_client
      tags: auth

    - role: nfs_client
      tags: files

    - role: aide
      tags: security

    - role: selinux
      tags: security

    - role: skel
      tags: defaults

    - role: serial
      tags: test

    - role: debug
      tags: test

    - role: dnf
      tags: proxy,dnf
