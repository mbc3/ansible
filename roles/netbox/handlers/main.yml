---
- name: Restart Netbox
  become: true
  become_user: "{{ netbox_user }}"
  ansible.builtin.systemd_service:
    name: netbox-pod
    state: restarted
    scope: user

- name: Restart Proxbox API
  become: true
  become_user: "{{ netbox_user }}"
  ansible.builtin.systemd_service:
    name: proxbox-api
    state: restarted
    scope: user

- name: Restart SSHD
  ansible.builtin.systemd_service:
    name: sshd
    state: restarted

- name: Restart firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    state: restarted
