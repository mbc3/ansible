---
- name: Create user
  ansible.builtin.user:
    name: "{{ woodpecker_agent_user }}"
    state: present
    comment: "Woodpecker CI Service Account"
    uid: "{{ woodpecker_agent_uid }}"

- name: Install necessary packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop: "{{ woodpecker_agent_packages }}"

- name: Install podman dependencies
  become: true
  become_user: "{{ woodpecker_agent_user }}"
  block:

    - name: Enable podman auto-update service
      ansible.builtin.systemd_service:
        name: podman-auto-update.timer
        enabled: true
        state: started
        scope: user

    - name: Enable linger
      ansible.builtin.command: loginctl enable-linger "{{ woodpecker_agent_user }}"
      changed_when: false

    - name: Enable socket
      ansible.builtin.command: systemctl --user enable --now podman.socket
      changed_when: true

- name: Install woodpecker agent
  become: true
  become_user: "{{ woodpecker_agent_user }}"
  notify: Restart Woodpecker-agent
  block:
    - name: Pull agent image
      containers.podman.podman_image:
        name: "{{ woodpecker_agent_registry }}"
        tag: "{{ woodpecker_agent_version }}"

    - name: Create agent quadlet file
      containers.podman.podman_container:
        name: woodpecker-agent
        image: "{{ woodpecker_agent_registry }}:{{ woodpecker_agent_version }}"
        state: quadlet
        volume:
          - woodpecker-agent-config:/etc/woodpecker:z
          - "/run/user/{{ woodpecker_agent_uid }}/podman/podman.sock:/run/user/{{ woodpecker_agent_uid }}/podman/podman.sock:z"
        env:
          WOODPECKER_SERVER: http://woodpecker.forgejo.localdomain:9000
          WOODPECKER_AGENT_SECRET: YOUR_INDIVIDUAL_AGENT_TOKEN
          WOODPECKER_GRPC_SECURE: false
          WOODPECKER_GRPC_SKIP_VERIFY: true
          WOODPECKER_MAX_WORKFLOWS: 2
          WOODPECKER_BACKEND: docker
          DOCKER_HOST: "unix:///run/user/{{ woodpecker_agent_uid }}/podman/podman.sock"
        quadlet_filename: woodpecker-agent
        quadlet_dir: "/home/{{ woodpecker_agent_user }}/.config/containers/systemd"
        quadlet_options:
          - "AutoUpdate=registry"
          - |
            [Unit]
            Wants=podman-user-wait-network-online.service
            After=podman-user-wait-network-online.service
            [Service]
            Restart=always
            [Install]
            WantedBy=default.target

    - name: Start woodpecker-agent service
      ansible.builtin.systemd_service:
        name: woodpecker-agent
        daemon_reload: true
        scope: user
        state: started
