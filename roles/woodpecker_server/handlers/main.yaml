---
- name: Restart Woodpecker-server
  become: true
  become_user: "{{ woodpecker_server_user }}"
  ansible.builtin.systemd_service:
    name: woodpecker-server
    state: restarted
    scope: user

- name: Restart firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    state: restarted
