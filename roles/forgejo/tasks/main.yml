---
- name: Create user
  ansible.builtin.user:
    name: "{{ forgejo_user }}"
    state: present
    comment: "Forgejo Service Account"

- name: Install necessary packages
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  loop: "{{ forgejo_packages }}"

- name: Install podman dependencies
  become: true
  become_user: "{{ forgejo_user }}"
  block:

    - name: Enable podman auto-update service
      ansible.builtin.systemd_service:
        name: podman-auto-update.timer
        enabled: true
        state: started

    - name: Enable linger
      ansible.builtin.command: loginctl enable-linger "{{ forgejo_user }}"
      changed_when: false

- name: Set up forgejo
  become: true
  become_user: "{{ forgejo_user }}"
  notify: Restart forgejo
  block:
    - name: Pull forgejo image
      containers.podman.podman_image:
        name: "{{ forgejo_image }}"
        tag: "{{ forgejo_image_version }}"

    - name: Create forgejo podman volume
      containers.podman.podman_volume:
        name: forgejo-data
        state: present

    - name: Create forgejo quadlet file
      containers.podman.podman_container:
        name: forgejo
        image: "{{ forgejo_image }}:{{ forgejo_image_version }}"
        state: quadlet
        quadlet_filename: forgejo
        quadlet_dir: "/home/{{ forgejo_user }}/.config/containers/systemd"
        volume:
          - forgejo-data:/data:z
        publish:
          - "3000:3000"
          - "222:22"
        env:
          USER_UID: 1000
          USER_GUID: 1000
        quadlet_options:
          - "AutoUpdate=registry"
          - |
            [Unit]
            Wants=network-online.target
            After=network-online.target
            [Service]
            Restart=always
            [Install]
            WantedBy=default.target

- name: Add forgejo custom firewalld service
  ansible.builtin.copy:
    src: forgejo.xml
    dest: /etc/firewalld/services/forgejo.xml
    owner: root
    group: root
    mode: "0644"
  notify: Restart firewalld

- name: Add forgejo firewalld service
  ansible.posix.firewalld:
    service: forgejo
    permanent: true
    immediate: true
    state: enabled

- name: Start forgejo
  become: true
  ansible.builtin.systemd_service:
    name: forgejo
    daemon_reload: true
    scope: user
    state: started
